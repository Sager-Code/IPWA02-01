<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
    
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <ui:insert name="title">Shea Shepherd - Geisternetz Bergung</ui:insert>
    </title>
    <h:outputStylesheet name="css/style.css" />
</h:head>

<h:body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>Shea Shepherd</h1>
                <p>Geisternetz-Bergungsprojekt</p>
            </div>
            
            <nav>
                <h:form>
                    <p:menubar>
                        <p:menuitem value="Startseite" outcome="/index" icon="pi pi-home" />
                        <p:menuitem value="Geisternetz melden" outcome="/report-ghostnet" icon="pi pi-plus" />
                        <p:menuitem value="Geisternetz bergen" outcome="/rescue-ghostnet" icon="pi pi-compass" />
                        <p:menuitem value="Alle Geisternetze" outcome="/list-ghostnets" icon="pi pi-list" />
                    </p:menubar>
                </h:form>
            </nav>
        </header>
        
        <main>
            <p:messages id="messages" showDetail="true" closable="true">
                <p:autoUpdate />
            </p:messages>
            
            <h2><ui:insert name="pageTitle">Seite</ui:insert></h2>
            
            <ui:insert name="content">
                <!-- Hier wird der Seiteninhalt eingefügt -->
                <p>Inhalt wird geladen...</p>
            </ui:insert>
        </main>
        
        <footer>
            <p>2025 Shea Shepherd - Geisternetz-Bergungsprojekt</p>
        </footer>
    </div>
</h:body>
</html>
